<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shop | Lumière</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo"><a href="../index.html">LUMIÈRE</a></div>
      <ul class="nav-menu">
        <li><a href="women.html">Women</a></li>
        <li><a href="men.html">Men</a></li>
        <li><a href="kids.html">Kids</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="nav-icons"><a href="#" class="icon">Search</a><a href="#" class="icon">Cart</a></div>
    </div>
  </nav>

  <main class="main-content">
    <header class="page-header-container">
      <h1 class="page-header-title">Shop</h1>
      <p class="page-subtitle">Browse our curated collections</p>
    </header>

    <section class="filters">
      <h3>Shop by Occasion</h3>
      <div class="filter-buttons">
        <button data-occasion="all" class="filter-btn active">All</button>
        <button data-occasion="casual" class="filter-btn">Casual</button>
        <button data-occasion="formal" class="filter-btn">Formal</button>
        <button data-occasion="business" class="filter-btn">Business</button>
        <button data-occasion="party" class="filter-btn">Party</button>
        <button data-occasion="evening" class="filter-btn">Evening</button>
        <button data-occasion="active" class="filter-btn">Active</button>
        <button data-occasion="winter" class="filter-btn">Winter</button>
        <button data-occasion="summer" class="filter-btn">Summer</button>
        <button data-occasion="beach" class="filter-btn">Beach</button>
        <button data-occasion="outdoor" class="filter-btn">Outdoor</button>
        <button data-occasion="school" class="filter-btn">School</button>
        <button data-occasion="wedding" class="filter-btn">Wedding</button>
      </div>
    </section>

    <section id="product-list" class="products-grid">
      <!-- Products will be rendered here -->
    </section>
  </main>

  <script src="../js/products-database.js"></script>
  <script src="../js/render-products.js"></script>
  <script src="../js/script.js"></script>
</body>
</html>
